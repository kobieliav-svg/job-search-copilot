<title>Job Search Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap">
<style>
/* Layout: right-to-left. Header, a six-tile status strip, a slim action bar, then the board:
   one column per stage, each a stack of job cards that can be dragged or moved with a menu. */
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --surface-2: #f6f8f9;
  --ink: #15222b;
  --muted: #5b6b76;
  --line: #d3dce1;
  --accent: #0d6470;
  --accent-ink: #ffffff;
  --accent-soft: #dcecee;
  --ok: #1f7a4d;
  --ok-soft: #dff1e7;
  --warn: #9a5b00;
  --warn-soft: #f8ecd6;
  --bad: #a8322a;
  --bad-soft: #f7e1df;
  --font-display: "Frank Ruhl Libre", "David", "Times New Roman", serif;
  --font-body: "Heebo", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10181d; --surface: #18232a; --surface-2: #1d2a32; --ink: #e6eef2; --muted: #9bb0bb; --line: #2b3a43;
    --accent: #4fb6c2; --accent-ink: #06262b; --accent-soft: #17343a;
    --ok: #5fc58f; --ok-soft: #173327; --warn: #e0a64a; --warn-soft: #3a2c14; --bad: #ef8a80; --bad-soft: #3d1e1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10181d; --surface: #18232a; --surface-2: #1d2a32; --ink: #e6eef2; --muted: #9bb0bb; --line: #2b3a43;
  --accent: #4fb6c2; --accent-ink: #06262b; --accent-soft: #17343a;
  --ok: #5fc58f; --ok-soft: #173327; --warn: #e0a64a; --warn-soft: #3a2c14; --bad: #ef8a80; --bad-soft: #3d1e1b;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
header .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.lang-sel { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; }
.lang-sel select { font: inherit; border: 0; background: transparent; color: var(--ink); cursor: pointer; padding: 0; }
button.lang, label.lang { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 500; }
.page { max-width: 1280px; margin-inline: auto; padding-inline: 16px; padding-block: 24px 48px; display: flex; flex-direction: column; gap: 22px; }
header { display: flex; flex-direction: column; gap: 2px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.6rem, 3.6vw, 2.2rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 70ch; }
h2 { font-weight: 700; font-size: 0.95rem; margin: 0; color: var(--muted); letter-spacing: 0.01em; }
section { display: flex; flex-direction: column; gap: 10px; }
button { font: inherit; }
button:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tile { background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .num { font-family: var(--font-display); font-weight: 500; font-size: clamp(1.4rem, 3vw, 1.9rem); line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .lbl { color: var(--muted); font-size: 0.88rem; overflow-wrap: anywhere; }
.tile.empty .num { color: var(--line); }
@media (max-width: 720px) { .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.meta { color: var(--muted); font-size: 0.88rem; margin: 0; }

.bar { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.bar .note { flex: 1 1 260px; min-width: 0; }
button.go { font-weight: 700; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
button.go:disabled { opacity: 0.5; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 11px; border-radius: 999px; background: var(--accent-soft); font-weight: 500; font-size: 0.92rem; }
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.pill[data-s="requested"] .dot, .pill[data-s="running"] .dot { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
.pill[data-s="done"] .dot { background: var(--ok); }
.pill[data-s="error"] .dot, .pill[data-s="stuck"] .dot { background: var(--bad); }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .pill .dot { animation: none !important; } }
.note { margin: 0; color: var(--muted); font-size: 0.9rem; }
.note.bad { color: var(--bad); }
.note.warn { color: var(--warn); }
.prepsum { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; font-size: 0.9rem; }
.prepsum strong { font-weight: 700; }
.prepsum button { all: unset; cursor: pointer; color: var(--accent); text-decoration: underline; overflow-wrap: anywhere; }
.prepsum button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.alerts { display: flex; flex-direction: column; gap: 6px; }
.alert { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; }

.board-wrap { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-template-columns: repeat(5, minmax(230px, 1fr)); gap: 12px; min-width: 0; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.col-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

.col-head span { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.empty-col { color: var(--muted); font-size: 0.88rem; padding: 10px 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; cursor: grab; }

.card-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.score { font-weight: 700; font-variant-numeric: tabular-nums; border-radius: 6px; padding: 1px 7px; font-size: 0.88rem; background: var(--surface-2); color: var(--muted); }
.score.hi { background: var(--ok-soft); color: var(--ok); }

.badge { font-size: 0.78rem; border-radius: 6px; padding: 1px 7px; }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.info { background: var(--accent-soft); color: var(--accent); }
.card .t { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .c { color: var(--muted); font-size: 0.86rem; overflow-wrap: anywhere; }
.card .k { font-size: 0.84rem; color: var(--ok); overflow-wrap: anywhere; }
.card details { font-size: 0.86rem; }
.card summary { cursor: pointer; color: var(--accent); }
.card details p { margin: 6px 0 0; color: var(--muted); overflow-wrap: anywhere; }
.card details a { color: var(--accent); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn-s { border-radius: 6px; padding: 5px 10px; font-size: 0.86rem; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn-s.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn-s.confirm { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn-s:disabled { opacity: 0.5; cursor: not-allowed; }
select.move { font: inherit; font-size: 0.86rem; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
.card .t-btn { all: unset; cursor: pointer; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .t-btn:hover { color: var(--accent); text-decoration: underline; }
.card .t-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.btn-s.more { align-self: stretch; color: var(--accent); }
.morning { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.morning .m-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.morning .m-head strong { font-size: 1rem; }
.morning .m-line { margin: 0; font-size: 0.92rem; overflow-wrap: anywhere; }
.morning .m-line.warn { color: var(--warn); }
.morning .m-line.bad { color: var(--bad); }
.morning button.link { all: unset; cursor: pointer; color: var(--accent); text-decoration: underline; }
.morning button.link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.morning .x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 2px 6px; }
.why { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 0.86rem; }
.why label { font-weight: 500; }
.why-note { font: inherit; font-size: 0.86rem; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }

.jobview { display: flex; flex-direction: column; gap: 14px; }

.co-h { font-family: var(--font-display); font-size: 1.4rem; color: var(--ink); margin: 0; }
.co-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }

.co-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 12px; }
.co-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 0.86rem; font-weight: 500; min-width: 0; }
.co-in { font: inherit; font-size: 0.92rem; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; width: 100%; box-sizing: border-box; }
.co-in:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.co-list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.co-row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 9px 12px; border-top: 1px solid var(--line); }

.job-head .c { color: var(--muted); overflow-wrap: anywhere; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h3 { margin: 0; font-size: 1.05rem; }

.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }

.checks label.off { color: var(--muted); cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.82rem; border-radius: 999px; padding: 2px 10px; background: var(--ok-soft); color: var(--ok); }
.chip.miss { background: var(--warn-soft); color: var(--warn); }
pre.doc { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-body); font-size: 0.92rem; line-height: 1.55; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; max-height: 520px; overflow-y: auto; }
.ct-person { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.ct-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.ct-top a { font-weight: 700; color: var(--ink); }
.ct-top a:hover { color: var(--accent); }
.ct-msg { display: flex; flex-direction: column; gap: 4px; }
.ct-msg .panel-head strong { font-size: 0.88rem; }
.ct-msg pre.doc { max-height: 260px; }
.ct-he { font-size: 0.88rem; color: var(--muted); margin: 0; }
.ct-set { display: inline-flex; gap: 6px; align-items: center; font-size: 0.88rem; cursor: pointer; }
.card .meta-line { font-size: 0.84rem; color: var(--ink); overflow-wrap: anywhere; }
.card .meta-line.iv { color: var(--accent); font-weight: 500; }
.jm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 12px; }
.jm-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 0.86rem; font-weight: 500; min-width: 0; }
.act-list { display: flex; flex-direction: column; gap: 6px; }
.act { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
.act.auto { background: var(--surface-2); border-style: dashed; }
.act .act-top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.act .act-top strong { font-size: 0.92rem; }
.act .act-top a { font-weight: 700; color: var(--ink); }
.act .meta { font-size: 0.84rem; }
.act > .btn-s { align-self: flex-start; max-width: 100%; overflow-wrap: anywhere; text-align: start; }
.act p { margin: 0; font-size: 0.88rem; overflow-wrap: anywhere; }
.act-form { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.fu-strip { background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 0.9rem; }
.fu-strip strong { color: var(--warn); }
.fu-strip button.link { all: unset; cursor: pointer; color: var(--ink); text-decoration: underline; overflow-wrap: anywhere; }
.fu-strip button.link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ppl-group { display: flex; flex-direction: column; gap: 6px; }
.ppl-group h3 { margin: 6px 0 0; font-size: 1rem; }
.path { font-family: ui-monospace, Consolas, monospace; font-size: 0.84rem; overflow-wrap: anywhere; color: var(--muted); }
.card .last { font-size: 0.84rem; color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .last.iv { color: var(--accent); font-weight: 500; }
.due-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); flex: none; }
.card-top .grow { flex: 1; }

.act-notes .k { font-weight: 700; color: var(--accent); }
.act-box { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.act-box textarea { font: inherit; font-size: 0.9rem; min-height: 64px; resize: vertical; }
.act-box .row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.act-box .row2 label { display: flex; flex-direction: column; gap: 3px; font-size: 0.84rem; font-weight: 500; }
.srch { display: flex; flex-direction: column; gap: 6px; }
.srch #q { max-width: 520px; }
.srch-res { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.s-row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: space-between; padding: 8px 12px; border-top: 1px solid var(--line); }

.s-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1 1 280px; }
.s-main .t { font-weight: 700; overflow-wrap: anywhere; }
.s-main button.t { all: unset; cursor: pointer; font-weight: 700; overflow-wrap: anywhere; }
.s-main button.t:hover { color: var(--accent); text-decoration: underline; }
.s-main button.t:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.s-meta { color: var(--muted); font-size: 0.84rem; overflow-wrap: anywhere; }

.s-foot { padding: 8px 12px; color: var(--muted); font-size: 0.86rem; border-top: 1px solid var(--line); }
.jd p { margin: 0; font-size: 0.9rem; overflow-wrap: anywhere; }

.iv-tip { margin: 0; font-size: 0.86rem; color: var(--warn); }
.iv-pr { border: 2px solid var(--accent); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }

.iv-ul { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 0.92rem; }
.iv-ul a { color: var(--accent); }
.nav { display: flex; flex-direction: column; gap: 0; margin-top: 10px; border-bottom: 1px solid var(--line); }
.nav-tg { display: none; align-self: flex-start; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 500; margin-bottom: 8px; }
.nav-items { display: flex; flex-wrap: wrap; gap: 2px; }

  .nav { border-bottom: 0; }
  .nav-tg { display: inline-flex; gap: 6px; align-items: center; }

}
.pg-intro { margin: 0; color: var(--muted); max-width: 75ch; }

.ct-row .acc-h { padding: 0; }
.ct-row .acc-b { padding: 8px 0 0; }

.ct-sug { display: flex; flex-wrap: wrap; gap: 6px; }

        db.collection("jobmeta").limit(500).onSnapshot(function (q) {
          var m = {}; q.docs.forEach(function (d) { var x = d.data(); if (x && x.job_id) m[x.job_id] = x; });
          jobmeta = m; renderBoard(); if (openId) renderJob();
        }, function () {});
        db.collection("people").limit(1000).onSnapshot(function (q) {
          people = q.docs.map(function (d) { return d.data(); }).filter(function (x) { return x && x.id; }); if (ctOpen) renderCt(); if (coOpen) renderCo();
        }, function () {});
        db.collection("codetails").limit(1000).onSnapshot(function (q) {
          codet = {}; q.docs.forEach(function (d) { var x = d.data(); if (x && x.key) codet[x.key] = x; }); if (coOpen) renderCo();
        }, function () {});
        db.collection("ivchat").limit(200).onSnapshot(function (q) {
          ivChat = {}; q.docs.forEach(function (d) { var x = d.data(); if (x && x.job_id) ivChat[x.job_id] = x; }); if (!ivChatBusy) renderChat();
        }, function () {});
        db.collection("ivextra").limit(200).onSnapshot(function (q) {
          ivExtra = {}; q.docs.forEach(function (d) { var x = d.data(); if (x && x.id) ivExtra[x.id] = x; }); if (ivOpen && !ivChatBusy) renderIv();
        }, function () {});
        db.collection("ivanswers").limit(200).onSnapshot(function (q) {
          ivAns = {}; q.docs.forEach(function (d) { var x = d.data(); if (x && x.job_id) ivAns[x.job_id] = x; }); if (ivOpen) renderIv();
        }, function () {});
        db.collection("interview").limit(200).onSnapshot(function (q) {
          ivKits = {}; q.docs.forEach(function (d) { var x = d.data(); if (x && x.job_id) ivKits[x.job_id] = x; }); if (ivOpen) renderIv();
        }, function () {});
        db.collection("prep").limit(200).onSnapshot(function (q) {
          var m = {}; q.docs.forEach(function (d) { var x = d.data(); if (x && x.job_id) m[x.job_id] = x; });
          preps = m; renderPrepSum(); renderBoard(); if (openId) renderJob();
        }, function () {});
        db.collection("company_actions").orderBy("requested_at", "desc").limit(40).onSnapshot(function (q) {
          coActs = q.docs.map(function (d) { return d.data(); });
          if (coOpen) renderCo();
        }, function () {});
        db.collection("actions").orderBy("requested_at", "desc").limit(60).onSnapshot(function (q) {
          actions = q.docs.map(function (d) { return d.data(); });
          // the status and follow-up tiles follow their moves too, not only the board.
          renderMorning(); renderAlerts(); renderStrip(); renderFups(); renderBoard(); renderIvBoard();
        }, function () {});
      } catch (e) {}
    }
    render();
    setInterval(function () {
      renderBar();
      var st = openId ? prepState(preps[openId]) : "", st2 = openId ? prepState(contacts[openId]) : "";
      if (["pending", "working", "stuck"].indexOf(st) >= 0 || ["pending", "working", "stuck"].indexOf(st2) >= 0) renderJob();
    }, 30000);
  }
  boot();
})();
</script>
